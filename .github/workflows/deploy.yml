name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/espresso-map-app-o9zq0o]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      # Re-screenshots the social preview on every deploy so its counts always
      # match the data. If it fails, the build already contains the committed
      # public/og-image.png, so the deploy still goes out with that.
      - name: Refresh social preview image
        run: node scripts/og-image.mjs dist/og-image.png
        continue-on-error: true
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
